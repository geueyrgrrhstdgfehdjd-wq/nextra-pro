name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip All Zip Files
        run: |
          find . -name "*.zip" -exec unzip -o {} \;

      - name: Build Unsigned App & Create IPA
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found Project: $PROJ_PATH"

          # สั่ง Build โดยปิดการตรวจ Signing ทุกรูปแบบ และปรับแต่งค่าข้าม Error Bridging Header
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "3105" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_METHOD=none \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_PRECOMPILE_PREFIX_HEADER=NO

          # จัดทำโครงสร้าง Payload สำหรับ IPA
          mkdir -p ./build/Payload
          APP_PATH=$(find ./build_output -name "*.app" | head -n 1)
          echo "Found App: $APP_PATH"

          cp -r "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r ThreeOneOSFive.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: build/ThreeOneOSFive.ipa
