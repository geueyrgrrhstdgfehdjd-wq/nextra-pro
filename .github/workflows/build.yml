name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip All Zip Files
        run: |
          find . -name "*.zip" -exec unzip -o {} \;

      - name: Build Unsigned IPA
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found Project: $PROJ_PATH"

          # ล้างแคชการบิลด์เก่า
          rm -rf ~/Library/Developer/Xcode/DerivedData

          # สั่ง Archive โดยระบุ Destination เป็น generic/platform=iOS
          xcodebuild archive \
            -project "$PROJ_PATH" \
            -scheme "3105" \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/ThreeOneOSFive.xcarchive \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          # บรรจุไฟล์ลง Payload และสร้าง .ipa
          mkdir -p ./build/Payload
          cp -r ./build/ThreeOneOSFive.xcarchive/Products/Applications/*.app ./build/Payload/
          cd ./build
          zip -r ThreeOneOSFive.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: build/ThreeOneOSFive.ipa
