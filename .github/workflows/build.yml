name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip All Zip Files
        run: |
          find . -name "*.zip" -exec unzip -o -q {} \;

      - name: Build Unsigned App & Create IPA
        run: |
          # 1. ค้นหาไฟล์ .xcodeproj
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found Project: $PROJ_PATH"

          # 2. เคลียร์โฟลเดอร์ผลลัพธ์เก่า
          rm -rf ./build_output ./build

          # 3. บิลด์โดยเพิ่มคำสั่งบังคับให้ข้าม Compile Error และรองรับทั้ง arm64 / x86_64
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "3105" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build_output \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            || true

          # 4. ค้นหาไฟล์ .app ที่บิลด์ออกมาได้
          APP_PATH=$(find ./build_output/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error:: ซอร์สโค้ด Swift ในโปรเจกต์มีข้อผิดพลาดร้ายแรง ทำให้ Xcode ไม่สามารถคอมไพล์เป็นไฟล์ .app ได้"
            exit 1
          fi
          echo "Found App: $APP_PATH"

          # 5. ทำการ Pack เป็น IPA
          mkdir -p ./build/Payload
          cp -R "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r -q ThreeOneOSFive.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ThreeOneOSFive-IPA
          path: build/ThreeOneOSFive.ipa
