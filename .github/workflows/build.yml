name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip All Zip Files
        run: |
          # แตกไฟล์ ZIP ทุกไฟล์ที่อยู่ใน Repo
          find . -name "*.zip" -exec unzip -o {} \;

      - name: Build Unsigned IPA
        run: |
          # 1. ค้นหาไฟล์ .xcodeproj
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found Project: $PROJ_PATH"

          if [ -z "$PROJ_PATH" ]; then
            echo "ERROR: File .xcodeproj not found in repository!"
            exit 1
          fi

          # 2. ค้นหา Scheme อัตโนมัติ
          SCHEME=$(xcodebuild -list -project "$PROJ_PATH" | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | xargs | awk '{print $1}')
          echo "Using Scheme: $SCHEME"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Scheme not found!"
            exit 1
          fi

          # 3. สั่ง Build Archive
          xcodebuild archive \
            -project "$PROJ_PATH" \
            -scheme "$SCHEME" \
            -archivePath ./build/ThreeOneOSFive.xcarchive \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # 4. แพ็กไฟล์ IPA
          mkdir -p ./build/Payload
          cp -r ./build/ThreeOneOSFive.xcarchive/Products/Applications/*.app ./build/Payload/
          cd ./build
          zip -r ThreeOneOSFive.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: build/ThreeOneOSFive.ipa
