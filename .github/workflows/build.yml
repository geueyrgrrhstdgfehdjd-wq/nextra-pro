name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip All Zip Files
        run: |
          find . -name "*.zip" -exec unzip -o -q {} \;

      - name: Build Unsigned App & Create IPA
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found Project: $PROJ_PATH"

          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_PATH" | grep -A 10 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')
          echo "Auto-detected Scheme: $SCHEME_NAME"

          if [ -z "$SCHEME_NAME" ]; then
            SCHEME_NAME="3105"
          fi

          # บิลด์ผ่าน iphonesimulator เพื่อข้ามข้อบังคับ Code Signing ของ Xcode
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "$SCHEME_NAME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ./build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

          # ค้นหาไฟล์ .app และสร้างโฟลเดอร์ Payload ทำเป็น .ipa
          mkdir -p ./build/Payload
          APP_PATH=$(find ./build_output/Build/Products/Debug-iphonesimulator -name "*.app" | head -n 1)
          echo "Found App: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find .app directory"
            exit 1
          fi

          cp -r "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r -q ThreeOneOSFive.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: build/ThreeOneOSFive.ipa
