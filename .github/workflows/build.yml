name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip All Zip Files
        run: |
          find . -name "*.zip" -exec unzip -o -q {} \;

      - name: Build Unsigned App & Create IPA
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found Project: $PROJ_PATH"

          rm -rf ./build_output ./build

          # บิลด์ผ่าน iphonesimulator เพื่อข้ามการตรวจ Certificate ทั้งหมด
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "3105" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath ./build_output \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

          # ค้นหาไฟล์ .app ที่บิลด์สมบูรณ์
          APP_PATH=$(find ./build_output/Build/Products/Release-iphonesimulator -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error:: ไม่พบไฟล์ .app"
            exit 1
          fi
          echo "Found App: $APP_PATH"

          # จัดโครงสร้าง Payload ให้ถูกต้องตามมาตรฐาน iOS IPA
          mkdir -p ./build/Payload
          cp -R "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r -q ThreeOneOSFive.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ThreeOneOSFive-IPA
          path: build/ThreeOneOSFive.ipa
