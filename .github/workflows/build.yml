name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip All Zip Files
        run: |
          find . -name "*.zip" -exec unzip -o {} \;

      - name: Build Unsigned App & Create IPA
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found Project: $PROJ_PATH"

          # สั่ง build ตัวแอป (.app) โดยตรงโดยปิดระบบ Code Signing ทุกชนิด
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "3105" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_METHOD=none

          # ย้ายไฟล์ .app ไปยัง Payload แล้วทำการ Zip ให้เป็นไฟล์ IPA
          mkdir -p ./build/Payload
          cp -r ./build_output/Build/Products/Release-iphoneos/*.app ./build/Payload/
          cd ./build
          zip -r ThreeOneOSFive.ipa Payload

          # ตรวจสอบการสร้างไฟล์
          if [ -f "ThreeOneOSFive.ipa" ]; then
            echo "IPA Build Success!"
          else
            echo "ERROR: IPA File not created!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: build/ThreeOneOSFive.ipa
