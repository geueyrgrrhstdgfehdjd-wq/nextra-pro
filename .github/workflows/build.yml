name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip All Zip Files
        run: |
          find . -name "*.zip" -exec unzip -o -q {} \;

      - name: Force Patch Swift Files & Project
        run: |
          # 1. บังคับเปลี่ยน Deployment Target ในโปรเจกต์เป็น iOS 15.0 ทั้งหมด
          find . -name "*.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' {} +

          # 2. ฉีด @available(iOS 15.0, *) ไว้บนสุดของทุกไฟล์ Swift อัตโนมัติเพื่อแก้ปัญหา Compile Error
          find . -name "*.swift" -exec sh -c '
            for file; do
              if ! grep -q "@available(iOS 15.0, \*)" "$file"; then
                echo "@available(iOS 15.0, *)\n$(cat "$file")" > "$file"
              fi
            done
          ' sh {} +

      - name: Build Unsigned App & Create IPA
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found Project: $PROJ_PATH"

          rm -rf ./build_output ./build

          # บิลด์ iOS แบบ Ad-hoc Signature เพื่อให้จบ Bundle ได้สมบูรณ์
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "3105" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build_output \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

          APP_PATH=$(find ./build_output/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error:: ไม่พบไฟล์ .app หลังจากการบิลด์"
            exit 1
          fi
          echo "Found App: $APP_PATH"

          # รวมไฟล์เข้า Payload เพื่อสร้าง IPA
          mkdir -p ./build/Payload
          cp -R "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r -q ThreeOneOSFive.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ThreeOneOSFive-IPA
          path: build/ThreeOneOSFive.ipa
