name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip All Zip Files
        run: |
          find . -name "*.zip" -exec unzip -o -q {} \;

      - name: Build Unsigned App & Create IPA
        run: |
          # 1. ค้นหาไฟล์ .xcodeproj
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found Project: $PROJ_PATH"

          # 2. ลบแคชบิลด์เก่าทั้งหมด
          rm -rf ./build_output ./build

          # 3. คำสั่งบิลด์ iOS แบบข้าม Code Signing และปิด Warning ทั้งหมด
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "3105" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build_output \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
            SWIFT_SUPPRESS_WARNINGS=YES

          # 4. ค้นหาไฟล์ .app ที่บิลด์สำเร็จ
          APP_PATH=$(find ./build_output/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error:: ไม่พบไฟล์ .app หลังจากการบิลด์"
            exit 1
          fi
          echo "Found App: $APP_PATH"

          # 5. จัดโครงสร้าง Payload และบีบอัดเป็น IPA
          mkdir -p ./build/Payload
          cp -R "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r -q ThreeOneOSFive.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ThreeOneOSFive-IPA
          path: build/ThreeOneOSFive.ipa
