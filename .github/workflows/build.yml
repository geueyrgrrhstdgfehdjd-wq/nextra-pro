name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip All Zip Files
        run: |
          find . -name "*.zip" -exec unzip -o -q {} \;

      - name: Clean Xcode Cache & Build Unsigned App
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found Project: $PROJ_PATH"

          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_PATH" | grep -A 10 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')
          echo "Auto-detected Scheme: $SCHEME_NAME"

          if [ -z "$SCHEME_NAME" ]; then
            SCHEME_NAME="3105"
          fi

          # 1. เคลียร์ DerivedData ทั้งหมดเพื่อลบ ModuleCache ที่ตีกัน
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ./build_output

          # 2. บิลด์โดยล็อค arm64 สำหรับ iphonesimulator และปิดการสร้าง Explicit Modules
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "$SCHEME_NAME" \
            -sdk iphonesimulator \
            -arch arm64 \
            -configuration Debug \
            -derivedDataPath ./build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_EXPLICIT_MODULES=NO

          # 3. จัดการโครงสร้าง IPA
          mkdir -p ./build/Payload
          APP_PATH=$(find ./build_output -name "*.app" | head -n 1)
          echo "Found App: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find .app directory"
            exit 1
          fi

          cp -r "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r -q ThreeOneOSFive.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: build/ThreeOneOSFive.ipa
