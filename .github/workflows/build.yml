name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip All Zip Files
        run: |
          find . -name "*.zip" -exec unzip -o {} \;

      - name: Build Unsigned App & Create IPA
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found Project: $PROJ_PATH"

          # 1. ล้าง DerivedData เก่า
          rm -rf ~/Library/Developer/Xcode/DerivedData

          # 2. สั่ง build สำหรับ Simulator เพื่อข้าม Code Signing 100%
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "3105" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ./build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_METHOD=none

          # 3. จัดโครงสร้าง Payload และบีบอัดเป็น IPA
          mkdir -p ./build/Payload
          APP_PATH=$(find ./build_output -name "*.app" | head -n 1)
          echo "Found App Bundle: $APP_PATH"

          cp -r "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r ThreeOneOSFive.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: build/ThreeOneOSFive.ipa
