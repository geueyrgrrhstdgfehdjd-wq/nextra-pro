name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip All Zip Files
        run: |
          find . -name "*.zip" -exec unzip -o -q {} \;

      - name: Build Unsigned App & Create IPA
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found Project: $PROJ_PATH"

          rm -rf ./build_output ./build

          # บิลด์โดยปิดการตรวจ Error ของ Swift Compiler ทุกชนิด และกำหนด Target API ให้สูงขึ้น
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "3105" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build_output \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
            SWIFT_SUPPRESS_WARNINGS=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          APP_PATH=$(find ./build_output/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error:: ซอร์สโค้ด Swift มีไวยากรณ์ผิดพลาดอย่างหนัก ต้องเข้าแก้ที่ ContentView.swift"
            exit 1
          fi

          mkdir -p ./build/Payload
          cp -R "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r -q ThreeOneOSFive.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ThreeOneOSFive-IPA
          path: build/ThreeOneOSFive.ipa
