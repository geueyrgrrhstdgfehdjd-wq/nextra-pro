name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip All Zip Files
        run: |
          find . -name "*.zip" -exec unzip -o -q {} \;

      - name: Patch Swift Code Automatically
        run: |
          find . -name "ContentView.swift" -exec perl -pi -e 's/private struct DashboardView/\@available\(iOS 15.0, \*\)\nprivate struct DashboardView/g' {} +
          find . -name "DisplayIdentityAttribution.swift" -exec perl -pi -e 's/public struct DisplayIdentityAttribution/\@available\(iOS 15.0, \*\)\npublic struct DisplayIdentityAttribution/g' {} +

      - name: Build Unsigned App & Create IPA
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found Project: $PROJ_PATH"

          rm -rf ./build_output ./build

          # ใช้ Ad-hoc Code Sign (-) เพื่อให้ Xcode ยอมสร้าง Bundle ให้จบกระบวนการ
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "3105" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build_output \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

          APP_PATH=$(find ./build_output/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error:: ไม่พบไฟล์ .app"
            exit 1
          fi
          echo "Found App: $APP_PATH"

          mkdir -p ./build/Payload
          cp -R "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r -q ThreeOneOSFive.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ThreeOneOSFive-IPA
          path: build/ThreeOneOSFive.ipa
